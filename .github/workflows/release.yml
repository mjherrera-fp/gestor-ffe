name: Release portable

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-portable
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Leer versión
        id: version
        run: |
          $v = node -p "require('./package.json').version"
          Add-Content $env:GITHUB_OUTPUT ("version=" + $v)

      - name: Comprobar que no exista release con la versión actual
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          Write-Host "Comprobando si ya existe la release $tag..."
          gh release view $tag --json tagName --quiet 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Ya existe una release con el tag $tag. Incrementa la versión en package.json antes de hacer commit."
            exit 1
          }
          Write-Host "OK: no existe $tag, se procede a empaquetar."

      - name: Inyectar token de actualización (si está configurado)
        shell: pwsh
        env:
          FFE_GH_TOKEN: ${{ secrets.FFE_GH_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:FFE_GH_TOKEN)) {
            Write-Warning "FFE_GH_TOKEN no está configurado en los secrets del repo. El portable generado NO podrá consultar releases del repo privado (actualizador inoperante). Configúralo en Settings > Secrets and variables > Actions."
          } else {
            $content = "export const UPDATE_TOKEN = '$env:FFE_GH_TOKEN';"
            [System.IO.File]::WriteAllText(
              (Join-Path (Get-Location) 'src/lib/update-secret.js'),
              $content,
              [System.Text.UTF8Encoding]::new($false)
            )
            Write-Host "src/lib/update-secret.js generado a partir del secret (no se versiona)."
          }

      - name: Empaquetar portable
        run: npm run pack:win:portable

      - name: Crear release y subir el portable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseDir = Resolve-Path release
          $exe = Get-ChildItem (Join-Path $releaseDir '*.exe') |
            Where-Object { $_.Name -match 'Gestor' -and $_.Name -inotmatch 'Setup' } |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error "No se encontró el portable en release\*.exe"
            exit 1
          }
          Write-Host ("Subiendo " + $exe.Name)
          $tag = "v$version"
          gh release create $tag $exe.FullName --title "Gestor FFE $version" --generate-notes