<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cargando Gestor-FFE...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc; /* Color slate-50 de Tailwind */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
      -webkit-app-region: drag; /* Permite arrastrar la ventana */
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb; /* Color primary/blue-600 */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0;
      color: #1e293b;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      margin-top: 8px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Gestor-FFE</h1>
  <p>Iniciando sistema de gestión...</p>
</body>
</html>
